<script>
/* ===================== Utilidades ===================== */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid = p => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const today = () => iso(new Date());
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const diff = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const DOW = ["dom","seg","ter","qua","qui","sex","sáb"];
const MES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const fmtD = s => s ? s.split("-").reverse().join("/") : "—";
const fmtDL = s => { if(!s) return "—"; const d=parse(s); return DOW[d.getDay()]+", "+fmtD(s); };
const BRL = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const money = v => BRL.format(Number(v)||0);
const toNum = v => { if(typeof v==="number") return v; const s=String(v||"").replace(/[^\d,.-]/g,""); return Number(s.includes(",") ? s.replace(/\./g,"").replace(",",".") : s) || 0; };

/* ===================== Feriados e dias úteis (CPC art. 219, 220, 224) ===================== */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
const _hol = {};
function holidays(y){
  if(_hol[y]) return _hol[y];
  const m = {};
  [["01-01","Confraternização Universal"],["04-21","Tiradentes"],["05-01","Dia do Trabalho"],["09-07","Independência"],["10-12","N. Sra. Aparecida"],["11-02","Finados"],["11-15","Proclamação da República"],["11-20","Consciência Negra"],["12-25","Natal"]]
    .forEach(([md,n]) => m[y+"-"+md]=n);
  const e = easter(y), rel = (n,name) => { const d=new Date(e); d.setDate(d.getDate()+n); m[iso(d)]=name; };
  rel(-48,"Carnaval"); rel(-47,"Carnaval"); rel(-2,"Sexta-feira Santa"); rel(60,"Corpus Christi");
  return _hol[y]=m;
}
function naoUtil(s){
  const d = parse(s), wd = d.getDay(), mo = d.getMonth()+1, da = d.getDate();
  if((mo===12 && da>=20) || (mo===1 && da<=20)) return "Recesso forense";
  const h = holidays(d.getFullYear())[s]; if(h) return h;
  if(wd===0 || wd===6) return "Fim de semana";
  return null;
}
function calcPrazo(inicio, dias, uteis){
  let d = inicio, n = 0; const pulados = [];
  if(uteis){
    while(n < dias){ d = addDays(d,1); const r = naoUtil(d); if(r) pulados.push([d,r]); else n++; }
  } else {
    d = addDays(d, dias);
    while(naoUtil(d)){ pulados.push([d, naoUtil(d)+" (prorrogação)"]); d = addDays(d,1); }
  }
  return { fim:d, pulados };
}

/* ===================== Número CNJ (Res. 65/2008) ===================== */
const UF = ["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SE","SP","TO"];
const cnjDig = s => String(s||"").replace(/\D/g,"").slice(0,20);
function cnjFmt(s){
  const d = cnjDig(s); let o = d.slice(0,7);
  if(d.length>7) o += "-"+d.slice(7,9);
  if(d.length>9) o += "."+d.slice(9,13);
  if(d.length>13) o += "."+d.slice(13,14);
  if(d.length>14) o += "."+d.slice(14,16);
  if(d.length>16) o += "."+d.slice(16,20);
  return o;
}
function cnjCheck(s){
  const d = cnjDig(s); if(d.length!==20) return null;
  const calc = 98n - (BigInt(d.slice(0,7)+d.slice(9)+"00") % 97n);
  return Number(calc) === Number(d.slice(7,9));
}
function cnjMake(seq, ano, j, tr, orig){
  const base = String(seq).padStart(7,"0"), rest = ano+j+tr+orig;
  const dv = 98n - (BigInt(base+rest+"00") % 97n);
  return cnjFmt(base+String(dv).padStart(2,"0")+rest);
}
function cnjTribunal(s){
  const d = cnjDig(s); if(d.length!==20) return "";
  const j = d[13], tr = Number(d.slice(14,16));
  if(j==="8") return UF[tr-1] ? "TJ"+UF[tr-1] : "";
  if(j==="4") return "TRF"+tr;
  if(j==="5") return tr ? "TRT"+tr : "TST";
  if(j==="6") return UF[tr-1] ? "TRE-"+UF[tr-1] : "TSE";
  if(j==="3") return "STJ"; if(j==="1") return "STF";
  return "";
}

/* ===================== Armazenamento (Supabase + cópia local) ===================== */
const S = { items:[], view:"painel", sel:null, ready:false, sync:{t:"",bad:false}, filtroProc:{q:"",status:"Ativo"}, filtroPrazo:{st:"pend",tipo:""} };
const all = t => S.items.filter(i => i.t===t);
const byId = id => S.items.find(i => i.id===id);
let SB = null, USER = null, PEND = {}, SEQ = 0, flushT = null, flushing = false, retryT = null;
const ck = () => "jus_data_"+USER.id, pk = () => "jus_pend_"+USER.id;
function cacheSave(){ if(!USER) return; try{ localStorage.setItem(ck(), JSON.stringify(S.items)); localStorage.setItem(pk(), JSON.stringify(PEND)); }catch(e){} }
function cacheLoad(){ try{ S.items = JSON.parse(localStorage.getItem(ck())||"[]"); PEND = JSON.parse(localStorage.getItem(pk())||"{}"); }catch(e){ S.items=[]; PEND={}; } }
function cacheWipe(){ try{ Object.keys(localStorage).forEach(k => { if(k.indexOf("jus_data_")===0 || k.indexOf("jus_pend_")===0) localStorage.removeItem(k); }); }catch(e){} }
function setSync(t, bad){ S.sync = {t, bad:!!bad}; const el = $("#sync"); if(el){ el.textContent = t; el.className = "sync"+(bad?" bad":""); } const c = $("#sync-conta"); if(c){ c.textContent = t; c.className = "sync"+(bad?" bad":""); } }
const pendCount = () => Object.keys(PEND).length;

async function save(obj){
  if(!obj.id) obj.id = rid(obj.t.slice(0,3));
  obj.atualizado = Date.now();
  const i = S.items.findIndex(x => x.id===obj.id);
  if(i>=0) S.items[i] = obj; else S.items.push(obj);
  PEND[obj.id] = {op:"up", v:++SEQ};
  cacheSave(); render(); schedule();
  return obj;
}
async function remove(id){
  S.items = S.items.filter(x => x.id!==id);
  PEND[id] = {op:"del", v:++SEQ};
  cacheSave(); render(); schedule();
}
function schedule(){ clearTimeout(flushT); flushT = setTimeout(flush, 400); }
async function flush(){
  if(!SB || !USER || flushing) return;
  const snap = JSON.parse(JSON.stringify(PEND)), ids = Object.keys(snap);
  if(!ids.length){ setSync("Tudo salvo na nuvem"); return; }
  flushing = true; setSync("Salvando…");
  const now = new Date().toISOString();
  const ups = ids.filter(i => snap[i].op==="up").map(byId).filter(Boolean).map(o => { const {id, ...dados} = o; return {user_id:USER.id, id, tipo:o.t, dados, updated_at:now}; });
  const dels = ids.filter(i => snap[i].op==="del");
  try{
    for(let k=0; k<ups.length; k+=200){ const r = await SB.from("registros").upsert(ups.slice(k,k+200), {onConflict:"user_id,id"}); if(r.error) throw r.error; }
    for(let k=0; k<dels.length; k+=200){ const r = await SB.from("registros").delete().eq("user_id",USER.id).in("id",dels.slice(k,k+200)); if(r.error) throw r.error; }
    ids.forEach(i => { if(PEND[i] && PEND[i].v===snap[i].v) delete PEND[i]; });
    cacheSave(); flushing = false;
    if(pendCount()) schedule(); else setSync("Tudo salvo na nuvem");
  }catch(e){
    flushing = false;
    const n = pendCount();
    setSync(n+(n===1?" alteração aguardando":" alterações aguardando")+" conexão. Salvas neste aparelho.", true);
    clearTimeout(retryT); retryT = setTimeout(flush, 15000);
    if(!S.errShown){ S.errShown = true; render(); }
  }
}
async function pull(){
  let rows = [], from = 0;
  while(true){
    const r = await SB.from("registros").select("id,tipo,dados").range(from, from+999);
    if(r.error) throw r.error;
    rows = rows.concat(r.data); if(r.data.length < 1000) break; from += 1000;
  }
  const map = new Map(rows.map(x => [x.id, {...x.dados, id:x.id, t:x.tipo}]));
  for(const [id,p] of Object.entries(PEND)){
    if(p.op==="del") map.delete(id);
    else { const loc = S.items.find(i => i.id===id); if(loc) map.set(id, loc); }
  }
  S.items = [...map.values()]; cacheSave(); S.errShown = false; render();
}
function sincronizar(){
  if(!USER || flushing) return;
  setSync("Sincronizando…");
  pull().then(flush).catch(() => setSync("Sem conexão. Mostrando a última cópia salva neste aparelho.", true));
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible") sincronizar(); });
window.addEventListener("online", () => flush());

function uiDialog({title, text, input, ok="OK", cancel="Cancelar", danger=false, noCancel=false}){

    const f = root.querySelector("form"), done = v => { root.innerHTML = ""; res(v); };

/* ===================== Regras de negócio ===================== */
function urg(ev){
  if(ev.feito) return {cls:"", chip:"ok", txt:"Concluído"};
  const d = diff(today(), ev.data);
  if(d<0) return {cls:"bad", chip:"bad", txt:"Vencido há "+(-d)+" d"};
  if(d===0) return {cls:"bad", chip:"bad", txt:"Hoje"};
  if(d===1) return {cls:"warn", chip:"warn", txt:"Amanhã"};
  if(d<=3) return {cls:"warn", chip:"warn", txt:"Em "+d+" dias"};
  if(d<=7) return {cls:"acc", chip:"acc", txt:"Em "+d+" dias"};
  return {cls:"", chip:"", txt:"Em "+d+" dias"};
}

function viewPrazos(){

  return `<div class="head"><div><h1>Prazos e agenda</h1><div class="sub">Prazos, audiências, reuniões e diligências</div></div>

const AREAS = ["Cível","Trabalhista","Família","Previdenciário","Tributário","Consumidor","Criminal","Empresarial","Administrativo","Outra"];
function field(f, v){
  const id = "fld-"+f.k, req = f.req?"required":"", cls = "f"+(f.full?" full":"");
  let input;
  if(f.type==="select") input = `<select id="${id}" name="${f.k}" ${req}>${f.opts.map(o=>{const [val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(v??"")===String(val)?"selected":""}>${esc(lab)}</option>`}).join("")}</select>`;
  else if(f.type==="textarea") input = `<textarea id="${id}" name="${f.k}" ${req}>${esc(v)}</textarea>`;
  else input = `<input id="${id}" name="${f.k}" type="${f.type||"text"}" value="${esc(v)}" ${req} ${f.ph?`placeholder="${esc(f.ph)}"`:""} ${f.mono?'class="mono"':""}>`;
  return `<div class="${cls}"><label for="${id}">${esc(f.label)}${f.req?" *":""}</label>${input}${f.hint!==undefined?`<span class="hint" id="${id}-hint">${esc(f.hint)}</span>`:""}</div>`;
}
function openForm({title, spec, obj, onSave, onDelete, extra="", after}){
  const root = $("#modal-root");
  root.innerHTML = `<div class="overlay" data-act="fechar-bg"><form class="modal" id="mform" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-h"><h2 style="font:600 20px var(--f-display)">${esc(title)}</h2><button class="x" type="button" data-act="fechar" aria-label="Fechar">×</button></div>
    ${extra}
    <div class="fields">${spec.map(f=>field(f, obj[f.k] ?? f.def ?? "")).join("")}</div>
    <div class="modal-f"><div>${onDelete?`<button class="btn danger" type="button" id="m-del">Excluir</button>`:""}</div>
      <div class="toolbar"><button class="btn" type="button" data-act="fechar">Cancelar</button><button class="btn pri" type="submit">Salvar</button></div></div>
  </form></div>`;
  const form = $("#mform");
  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    const o = { ...obj };
    spec.forEach(f => { const el = form.elements[f.k]; if(el) o[f.k] = f.type==="number"||f.money ? (el.value===""?"":toNum(el.value)) : el.value.trim(); });
    const ok = await onSave(o, form);
    if(ok!==false) closeModal();
  });
  if(onDelete){ const b = $("#m-del"); b.addEventListener("click", async () => {
    if(!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent = "Confirmar exclusão"; return; }
    await onDelete(); closeModal();
  }); }
  if(after) after(form);
  const first = form.querySelector("input,select,textarea"); if(first) first.focus();
}
function closeModal(){ $("#modal-root").innerHTML = ""; }
document.addEventListener("keydown", e => { if(e.key==="Escape" && $("#modal-root").innerHTML) closeModal(); });

function formProcesso(p={t:"processo", status:"Ativo", andamentos:[]}){
  openForm({ title: p.id ? "Editar processo" : "Novo processo", obj:p,
    spec:[
      {k:"numero",label:"Número do processo (CNJ)",full:true,mono:true,ph:"0000000-00.0000.0.00.0000",hint:"Digite só os números; a máscara é aplicada sozinha."},
      {k:"clienteId",label:"Cliente",type:"select",opts:cliOpts()},
      {k:"novoCliente",label:"…ou cadastre um cliente novo",ph:"Nome completo"},
      {k:"polo",label:"Polo do cliente",type:"select",opts:["Autor","Réu","Reclamante","Reclamada","Exequente","Executado","Terceiro interessado"]},
      {k:"contraria",label:"Parte contrária"},
      {k:"area",label:"Área",type:"select",opts:AREAS},
      {k:"classe",label:"Classe / ação",ph:"Ex.: Procedimento Comum Cível"},

      {k:"distribuicao",label:"Data de distribuição",type:"date"},
      {k:"valor",label:"Valor da causa (R$)",money:true,ph:"0,00"},
      {k:"status",label:"Situação",type:"select",opts:["Ativo","Suspenso","Arquivado","Encerrado"]},
      {k:"obs",label:"Observações",type:"textarea",full:true}
    ],
    after(form){
      const n = form.elements.numero, hint = $("#fld-numero-hint"), trib = form.elements.tribunal;
      const upd = () => { n.value = cnjFmt(n.value); const c = cnjCheck(n.value);
        if(c===null){ hint.className="hint"; hint.textContent = cnjDig(n.value).length ? "Faltam "+(20-cnjDig(n.value).length)+" dígitos." : "Digite só os números; a máscara é aplicada sozinha."; }
        else if(c){ hint.className="hint ok"; const tr=cnjTribunal(n.value); hint.textContent = "Número válido"+(tr?" · "+tr:"")+"."; if(tr && !trib.value) trib.value = tr; }
        else { hint.className="hint bad"; hint.textContent = "Dígito verificador não confere. Confira o número."; } };
      n.addEventListener("input", upd); if(n.value) upd();
    },
    async onSave(o){
      if(o.novoCliente){ const c = await save({t:"cliente", nome:o.novoCliente}); o.clienteId = c.id; }
      delete o.novoCliente;
      if(!o.clienteId){ toast("Escolha ou cadastre o cliente."); return false; }

      if(!p.id){ S.view="processos"; S.sel=o.id; if(location.hash!=="#processos") history.replaceState(null,"","#processos"); render(); }
    },
    onDelete: p.id ? async () => { await remove(p.id); S.sel=null; toast("Processo excluído. Prazos e honorários dele continuam cadastrados."); } : null
  });
}

    ${demo?`<button class="btn danger" type="button" data-act="limpar-demo">Apagar dados de exemplo</button>`:""}</div>
    <input type="file" id="bk-file" accept="application/json,.json" hidden>
  </div>
  <div class="card danger-zone"><h2>Excluir conta</h2>
    <div class="muted" style="font-size:14px">Apaga sua conta e todos os seus clientes, processos, prazos e honorários de forma definitiva. Baixe um backup antes, se quiser guardar uma cópia.</div>
    <div><button class="btn danger" type="button" data-act="excluir-conta">Excluir minha conta</button></div>
  </div>
  <div class="legal muted" style="font-size:13px"><a href="termos.html">Termos de Uso</a> · <a href="privacidade.html">Política de Privacidade</a> · SaltJus, um produto SALT TECH SOLUTION</div>`;
}
function baixar(nome, texto){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([texto], {type:"application/json"})); a.download = nome; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
async function restaurarArquivo(file){
  try{
    const d = JSON.parse(await file.text()), its = Array.isArray(d) ? d : d.itens;
    if(!Array.isArray(its)) throw 0;
    const ok = its.filter(o => o && o.t && ["cliente","processo","evento","honorario"].includes(o.t) && o.id);
    if(!ok.length) throw 0;
    if(!(await uiConfirm(ok.length+" registros serão restaurados. Registros com o mesmo código serão substituídos.", {title:"Restaurar backup", ok:"Restaurar"}))) return;
    ok.forEach(o => { const i = S.items.findIndex(x => x.id===o.id); if(i>=0) S.items[i] = {...o}; else S.items.push({...o}); PEND[o.id] = {op:"up", v:++SEQ}; });
    cacheSave(); render(); schedule(); toast(ok.length+" registros restaurados.");
  }catch(e){ uiAlert("Esse arquivo não é um backup válido do SaltJus.", "Backup inválido"); }
}
async function sair(){
  if(pendCount() && !(await uiConfirm("Algumas alterações ainda não chegaram à nuvem. Se sair agora, elas serão perdidas.", {title:"Sair da conta", ok:"Sair mesmo assim", danger:true}))) return;
  cacheWipe(); await SB.auth.signOut(); leave();
}
async function excluirConta(){
  if(!(await uiConfirm("Isso apaga sua conta e todos os seus dados de forma definitiva. Não dá para desfazer.", {title:"Excluir conta", ok:"Continuar", danger:true}))) return;
  const v = await uiPrompt("Confirmar exclusão", "Digite EXCLUIR para confirmar", {ok:"Excluir conta"});
  if(v===null) return;
  if(String(v).trim().toUpperCase()!=="EXCLUIR"){ toast("Confirmação incorreta. Nada foi apagado."); return; }
  const r = await SB.rpc("delete_my_account").catch(() => ({error:true}));
  if(r.error){ uiAlert("Não foi possível excluir a conta agora. Tente de novo em instantes.", "Exclusão"); return; }
  cacheWipe(); await SB.auth.signOut(); leave(); uiAlert("Sua conta e seus dados foram excluídos.", "Conta excluída");
}

/* ===================== Eventos ===================== */
function toast(msg){ const el=document.createElement("div"); el.className="toast"; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),3200); }

document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if(a==="fechar-bg" && ev.target!==el) return;
  switch(a){
    case "fechar": case "fechar-bg": closeModal(); break;
    case "novo-proc": formProcesso(); break;
    case "edit-proc": formProcesso({...byId(id)}); break;
    case "abrir-proc": closeModal(); S.sel=id; if(location.hash!=="#processos"){ history.pushState(null,"","#processos"); } S.view="processos"; render(); window.scrollTo(0,0); break;
    case "voltar": S.sel=null; render(); break;
    case "novo-ev": formEvento({t:"evento",tipo:"Prazo",data:today(),feito:false,processoId:el.dataset.proc||S.sel||""}); break;
    case "edit-ev": formEvento({...byId(id)}); break;
    case "toggle-ev": { const e={...byId(id)}; e.feito=!e.feito; await save(e); break; }
    case "novo-cli": formCliente(); break;
    case "edit-cli": formCliente({...byId(id)}); break;
    case "novo-hon": { const p = byId(el.dataset.proc); formHonorario({t:"honorario",pago:false,processoId:p?p.id:"",clienteId:p?p.clienteId:""}); break; }
    case "edit-hon": formHonorario({...byId(id), pago:String(!!byId(id).pago)}); break;
    case "toggle-hon": { const h={...byId(id)}; h.pago=!h.pago; await save(h); break; }
    case "f-status": S.filtroProc.status = el.dataset.v; render(); break;
    case "f-st": S.filtroPrazo.st = el.dataset.v; render(); break;
    case "demo": el.disabled = true; await seedDemo(); break;
    case "baixar": baixar("backup-saltjus-"+today()+".json", JSON.stringify({app:"saltjus", versao:1, exportado:new Date().toISOString(), itens:S.items}, null, 1)); toast("Backup baixado."); break;
    case "restaurar": { const fi = $("#bk-file"); fi.value = ""; fi.onchange = () => { if(fi.files[0]) restaurarArquivo(fi.files[0]); }; fi.click(); break; }
    case "sincronizar": sincronizar(); break;
    case "sair": sair(); break;
    case "excluir-conta": excluirConta(); break;
    case "tema": { const v = el.dataset.v; try{ if(v) localStorage.setItem("jus_theme", v); else localStorage.removeItem("jus_theme"); }catch(e){} if(v) document.documentElement.setAttribute("data-theme", v); else document.documentElement.removeAttribute("data-theme"); render(); break; }
    case "limpar-demo": { if(!(await uiConfirm("Apagar todos os clientes, processos, prazos e honorários de exemplo? Seus próprios cadastros não são afetados.", {title:"Apagar exemplo", ok:"Apagar", danger:true}))) break;
      S.items.filter(i=>i.demo).forEach(i => { PEND[i.id] = {op:"del", v:++SEQ}; }); S.items = S.items.filter(i=>!i.demo); cacheSave(); render(); schedule(); toast("Dados de exemplo apagados."); break; }
    case "calc": {
      const ini = $("#c-ini").value || today(), n = Number($("#c-dias").value)||1, u = $("#c-tipo").value==="u";
      const r = calcPrazo(ini, n, u);
      $("#c-out").innerHTML = `Vence em <b>${fmtDL(r.fim)}</b> <span class="chip ${urg({data:r.fim}).chip}">${urg({data:r.fim}).txt}</span>
        ${r.pulados.length?`<div class="muted" style="font-size:13px;margin-top:4px">Dias desconsiderados: ${r.pulados.map(([d,m])=>fmtD(d).slice(0,5)+" ("+esc(m)+")").join(", ")}</div>`:""}
        <div class="muted" style="font-size:12px;margin-top:4px">Conta a partir do dia útil seguinte à intimação. Considera feriados nacionais e o recesso de 20/12 a 20/01; feriados locais e suspensões do tribunal não entram.</div>
        <div style="margin-top:8px"><button class="btn sm pri" type="button" data-act="calc-criar" data-v="${r.fim}">Criar prazo com essa data</button></div>`;
      break; }
    case "calc-criar": formEvento({t:"evento",tipo:"Prazo",data:el.dataset.v,feito:false}); break;
  }
});
document.addEventListener("keydown", e => { if(e.key==="Enter" && e.target.matches("tr.click")) e.target.click(); });

function afterRender(){
  const q = $("#q-proc");
  if(q){ q.addEventListener("input", () => { S.filtroProc.q = q.value; const pos=q.selectionStart; render(); const n=$("#q-proc"); n.focus(); n.setSelectionRange(pos,pos); }); }
  const ft = $("#f-tipo"); if(ft) ft.addEventListener("change", () => { S.filtroPrazo.tipo = ft.value; render(); });
  const fa = $("#f-and");
  if(fa) fa.addEventListener("submit", async e => { e.preventDefault(); const p = {...byId(S.sel)}; const txt=$("#and-txt").value.trim(); if(!txt) return;
    p.andamentos = [...(p.andamentos||[]), {d:$("#and-d").value||today(), txt}]; await save(p); toast("Andamento registrado."); });
}
